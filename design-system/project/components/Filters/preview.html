<!-- @dsCard group="Portafolio" height=170 -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Filters</title></head>
<body class="pn-surface-white">
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs><filter id="rough" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs>
  <symbol id="ast" viewBox="0 0 100 100"><g stroke="currentColor" stroke-width="11" stroke-linecap="round" fill="none" filter="url(#rough)"><path d="M50 50 L51 8"/><path d="M50 50 L81 20"/><path d="M50 50 L92 53"/><path d="M50 50 L79 81"/><path d="M50 50 L47 93"/><path d="M50 50 L19 82"/><path d="M50 50 L7 46"/><path d="M50 50 L21 18"/></g></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
</svg>
<div class="pn-pad">
  <div class="pn-tools">
    <label class="pn-sort" for="sort"><span>Orden</span><select id="sort"><option>Destacados</option><option>A–Z</option></select></label>
    <label class="pn-search" for="q"><input id="q" type="search" placeholder="Buscar" aria-label="Buscar proyectos"><svg class="pn-ico" aria-hidden="true"><use href="#i-search"/></svg></label>
    <div class="pn-tags-filter" role="group" aria-label="Filtrar por tipo"><button class="pn-tf" aria-pressed="true">#Todo</button><button class="pn-tf" aria-pressed="false">#Redes</button><button class="pn-tf" aria-pressed="false">#Branding</button><button class="pn-tf" aria-pressed="false">#Editorial</button><button class="pn-tf" aria-pressed="false">#Ilustración</button><button class="pn-tf" aria-pressed="false">#Fotomontaje</button><button class="pn-tf" aria-pressed="false">#Video</button></div>
  </div>
</div>
<script>
document.querySelectorAll('.pn-tf').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.pn-tf').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
</script>
</body>
</html>
